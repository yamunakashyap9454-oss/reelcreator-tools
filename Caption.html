<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Caption Generator - ReelCreator Tools</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:white;
font-family:Arial,sans-serif;
text-align:center;
padding:20px;
}

.container{
max-width:600px;
margin:auto;
}

h1{
font-size:32px;
margin-top:20px;
}

.subtitle{
color:#aaa;
font-size:16px;
margin-bottom:25px;
}

.card{
background:#1c1c1c;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

input, select{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:10px;
font-size:16px;
outline:none;
background:#292929;
color:white;
}

button{
background:#ff0066;
color:white;
padding:13px 22px;
border:none;
border-radius:10px;
font-size:17px;
margin:8px;
cursor:pointer;
}

button:hover{
background:#ff3385;
}

#result{
margin-top:20px;
padding:20px;
background:#252525;
border-radius:15px;
font-size:19px;
line-height:1.6;
min-height:60px;
white-space:pre-wrap;
}

.back{
background:#333;
}

.loading{
color:#ff6699;
}

@media(max-width:600px){
h1{
font-size:28px;
}

.card{
padding:20px;
}
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 AI Caption Generator</h1>

<p class="subtitle">
Create unique Instagram captions with AI 🚀
</p>

<div class="card">

<input
id="topic"
type="text"
placeholder="Topic likho... जैसे Sad, Love, Nature, Attitude">

<select id="mood">
<option value="sad">🥀 Sad</option>
<option value="love">❤️ Love</option>
<option value="attitude">😎 Attitude</option>
<option value="nature">🌿 Nature</option>
<option value="motivation">🔥 Motivation</option>
<option value="aesthetic">✨ Aesthetic</option>
</select>

<button onclick="generateAI()">
🤖 Generate AI Caption
</button>

<div id="result">
AI caption yahan dikhega...
</div>

<button onclick="copyText()">
📋 Copy
</button>

<button class="back" onclick="location.href='index.html'">
⬅ Back Home
</button>

</div>

</div>


<script>

async function generateAI(){

let topic=document.getElementById("topic").value.trim();
let mood=document.getElementById("mood").value;
let result=document.getElementById("result");

if(topic===""){
alert("Pehle topic likho bhai ❤️");
return;
}

result.innerText="🤖 AI caption bana raha hai...";

try{

/*
  Yahan baad me Cloudflare Worker ka URL lagega.
  Example:
  https://reelcreator-ai.YOUR-NAME.workers.dev
*/

let response=await fetch("YOUR_CLOUDFLARE_WORKER_URL",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

topic:topic,
mood:mood

})

});

if(!response.ok){
throw new Error("AI request failed");
}

let data=await response.json();

result.innerText=data.caption || "Caption nahi bana.";

}

catch(error){

console.error(error);

result.innerText=
"⚠️ AI service abhi connect nahi hai.\n\nCloudflare Worker connect karne ke baad AI captions generate honge.";

}

}


function copyText(){

let text=document.getElementById("result").innerText;

if(
text==="" ||
text==="AI caption yahan dikhega..."
){
alert("Pehle caption generate karo!");
return;
}

navigator.clipboard.writeText(text)
.then(function(){

alert("✅ Caption copied!");

})
.catch(function(){

alert("❌ Copy nahi ho paya.");

});

}

</script>

</body>
</html>
