<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Caption Generator</title>
<style>
body{margin:0;font-family:Arial;background:#111;color:#fff;display:flex;justify-content:center}
.box{max-width:600px;width:100%;padding:20px}
input,select,button{width:100%;padding:14px;margin:10px 0;border-radius:10px;border:none}
input,select{background:#222;color:#fff}
button{background:#ff0066;color:#fff;font-weight:bold}
#result{background:#222;padding:15px;border-radius:10px;min-height:70px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box">
<h1>🤖 AI Caption Generator</h1>
<input id="topic" placeholder="Topic likho...">
<select id="mood">
<option value="love">❤️ Love</option>
<option value="sad">🥀 Sad</option>
<option value="attitude">😎 Attitude</option>
<option value="nature">🌿 Nature</option>
<option value="motivation">🔥 Motivation</option>
</select>
<button onclick="generateAI()">🤖 Generate AI Caption</button>
<div id="result">Caption yahan dikhega...</div>
<button onclick="copyText()">📋 Copy</button>
<button onclick="location.href='index.html'">⬅ Back Home</button>
</div>
<script>
async function generateAI(){
const topic=document.getElementById("topic").value.trim();
const mood=document.getElementById("mood").value;
const result=document.getElementById("result");
if(!topic){alert("Pehle topic likho ❤️");return;}
result.innerText="⏳ AI Caption bana raha hai...";
try{
const res=await fetch("https://rough-shadow-0c3e.yamunakashyap9454.workers.dev/",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({topic,mood})
});
const data=await res.json();
result.innerText=data.caption||data.captions||data.message||"❌ Caption nahi mila.";
}catch(e){
result.innerText="❌ AI Server Error";
}}
function copyText(){
navigator.clipboard.writeText(document.getElementById("result").innerText);
alert("Copied!");
}
</script>
</body>
</html>
