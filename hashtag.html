<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hashtag Generator</title>

<style>
body{
background:#111;
color:white;
font-family:Arial,sans-serif;
text-align:center;
padding:20px;
}
input{
width:90%;
padding:12px;
font-size:18px;
border:none;
border-radius:10px;
margin:10px 0;
}
button{
padding:12px 20px;
font-size:18px;
background:#ff0066;
color:white;
border:none;
border-radius:10px;
margin:10px;
cursor:pointer;
}
#result{
margin-top:20px;
font-size:18px;
line-height:32px;
white-space:pre-wrap;
}
</style>
</head>

<body>

<h2>🏷 Hashtag Generator</h2>

<input id="topic" placeholder="Topic likho (Sad, Love, Nature, Motivation)">

<br>

<button onclick="generate()">Generate</button>

<div id="result"></div>

<button onclick="copyText()">📋 Copy</button>

<br>

<button onclick="location.href='index.html'">⬅ Back Home</button>

<script>

function generate(){

let t=document.getElementById("topic").value
.trim()
.toLowerCase();

let result=document.getElementById("result");

if(t===""){
result.innerText="⚠️ Pehle topic likho.";
return;
}

t=t.replace(/[^a-z0-9\s]/g,"").replace(/\s+/g,"");

let words=[
"viral",
"reels",
"instagram",
"trending",
"explore",
"explorepage",
"fyp",
"foryou",
"viralreels",
"trendingreels",
"reelitfeelit",
"instareels",
"reelsinstagram",
"reelkarofeelkaro",
"contentcreator",
"creator",
"creatorlife",
"smallcreator",
"indiancreator",
"india",
"indian",
"instagood",
"instadaily",
"instagramreels",
"viralvideo",
"viralcontent",
"trendingnow",
"reelvideo",
"reelcreator",
"socialmedia",
"contentcreation",
"motivation",
"inspiration",
"success",
"life",
"quotes",
"shayari",
"love",
"lovequotes",
"beautiful",
"photography",
"photo",
"video",
"daily",
"fun",
"entertainment",
"lifestyle",
"fashion",
"travel",
"nature",
"sunset",
"rain",
"music",
"fitness",
"gym",
"gaming",
"comedy",
"funny",
"memes",
"status",
"attitude",
"smile",
"happy",
"friends",
"family"
];

/* Topic ke saath hashtags */

let tags=[
"#"+t,
"#"+t+"reels",
"#"+t+"instagram",
"#"+t+"video",
"#"+t+"viral",
"#"+t+"trending",
"#"+t+"creator",
"#"+t+"india",
"#"+t+"daily",
"#"+t+"content"
];

/* Random hashtags add karo */

let shuffled=[...words].sort(()=>Math.random()-0.5);

for(let i=0;i<shuffled.length && tags.length<30;i++){

let tag="#"+shuffled[i];

if(!tags.includes(tag)){
tags.push(tag);
}

}

/* Random 20 hashtags */

tags=tags
.sort(()=>Math.random()-0.5)
.slice(0,20);

result.innerText=tags.join(" ");

}


/* COPY BUTTON */

function copyText(){

let text=document.getElementById("result").innerText;

if(
text==="" ||
text==="Your hashtags will appear here..."
){

alert("⚠️ Pehle hashtags generate karo.");

return;
}

navigator.clipboard.writeText(text);

alert("✅ Hashtags Copied Successfully!");

}

</script>

</body>
</html>
